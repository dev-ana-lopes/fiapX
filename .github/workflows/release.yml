name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version in SemVer format, e.g. v1.2.3'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  quality-gates:
    name: release-quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.8.14', enable-cache: true}
      - name: Backend gates
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy apps packages
          uv run alembic heads
          uv run pytest --cov=apps --cov=packages --cov-fail-under=20 --timeout=30
          uv run pip-audit --strict
      - uses: actions/setup-node@v4
        with: {node-version: '22.22.3', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Frontend gates
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Compose gate
        run: docker compose config --quiet

  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: quality-gates
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/fiapx
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-frontend:${{ env.VERSION }},${{ env.IMAGE_PREFIX }}-frontend:sha-${{ github.sha }},${{ env.IMAGE_PREFIX }}-frontend:latest
          provenance: true
          sbom: true
      - name: Build and push video-worker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-video-worker:${{ env.VERSION }},${{ env.IMAGE_PREFIX }}-video-worker:sha-${{ github.sha }}
          provenance: true
          sbom: true
      - name: Build and push notification-worker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-notification-worker:${{ env.VERSION }},${{ env.IMAGE_PREFIX }}-notification-worker:sha-${{ github.sha }}
          provenance: true
          sbom: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$VERSION" --generate-notes --verify-tag
