name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  dependency-and-secrets:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - uses: astral-sh/setup-uv@v7
        with: {version: '0.8.14', enable-cache: true}
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Python dependency scan
        working-directory: backend
        run: uv run pip-audit --strict
      - uses: actions/setup-node@v4
        with: {node-version: '22.22.3', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Frontend dependency scan
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Security summary
        if: always()
        run: |
          {
            echo '### Security quality gate'
            echo '- Dependency Scan: completed (high/critical gate)'
            echo '- Secret Scan: completed'
            echo '- Critical findings: block the workflow'
            echo '- Medium/low findings: reviewed as advisories'
          } >> "$GITHUB_STEP_SUMMARY"

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, python
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
