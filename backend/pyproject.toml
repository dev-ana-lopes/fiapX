[project]
name = "fiapx-backend"
version = "0.1.0"
description = "FIAP X asynchronous video processing foundation"
requires-python = ">=3.14"
dependencies = [
  "aio-pika>=9.5.5",
  "argon2-cffi>=25.1.0",
  "alembic>=1.16.4",
  "asyncpg>=0.30.0",
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "minio>=7.2.15",
  "python-multipart>=0.0.20",
  "prometheus-client>=0.22.1",
  "PyJWT>=2.10.1",
  "pydantic-settings>=2.10.1",
  "python-json-logger>=3.3.0",
  "redis>=6.4.0",
  "sqlalchemy[asyncio]>=2.0.43",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = ["mypy>=1.17.1", "pytest>=8.4.1", "pytest-asyncio>=1.1.0", "ruff>=0.12.9"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["apps", "packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["apps/api/src", "apps/video_worker/src", "apps/notification_worker/src", "packages/shared"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
