services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fiapx}
      POSTGRES_USER: ${POSTGRES_USER:-fiapx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fiapx}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fiapx}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fiapx}
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-fiapx}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-fiapxsecret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://fiapx:fiapx@postgres:5432/fiapx
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://fiapx:fiapx@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: fiapx
      MINIO_SECRET_KEY: fiapxsecret
      MINIO_BUCKET: videos
      MINIO_SECURE: "false"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      PYTHONPATH: /app/apps/api/src:/app/apps/video_worker/src:/app/apps/notification_worker/src:/app/packages/shared
    command: uvicorn fiapx_api.main:app --host 0.0.0.0 --port 8000
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]

  video-worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://fiapx:fiapx@postgres:5432/fiapx
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://fiapx:fiapx@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: fiapx
      MINIO_SECRET_KEY: fiapxsecret
      MINIO_BUCKET: videos
      MINIO_SECURE: "false"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      PYTHONPATH: /app/apps/api/src:/app/apps/video_worker/src:/app/packages/shared
    command: python -m fiapx_video_worker.main
    depends_on:
      rabbitmq: {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}

  notification-worker:
    build: ./backend
    environment:
      RABBITMQ_URL: amqp://fiapx:fiapx@rabbitmq:5672/
      PYTHONPATH: /app/apps/api/src:/app/apps/notification_worker/src:/app/packages/shared
    command: python -m fiapx_notification_worker.main
    depends_on:
      rabbitmq: {condition: service_healthy}

  frontend:
    build: ./frontend
    ports: ["${FRONTEND_PORT:-4200}:80"]
    depends_on: [api]

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
