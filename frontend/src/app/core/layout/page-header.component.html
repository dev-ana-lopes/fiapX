<header class="topbar page-header">
  <div class="page-header-copy">
    <p class="page-kicker">{{ eyebrow() }}</p>
    <h1>{{ title() }}</h1>
    <p class="muted">{{ subtitle() }}</p>
  </div>
  <div class="top-actions page-header-actions">
    <a
      class="primary-button new-video-button"
      routerLink="/dashboard"
      [queryParams]="{ upload: 'true' }"
    >
      ＋ &nbsp;NOVO VÍDEO
    </a>
    <app-notification-bell />
    <span class="avatar" aria-hidden="true">{{ userInitials() }}</span>
    <span class="user-name">{{ auth.currentUser()?.name || "Usuário" }}</span>
  </div>
</header>
