<nav class="breadcrumbs" aria-label="Navegação estrutural">
  <ol>
    @for (item of items(); track item.label; let last = $last) {
      <li>
        @if (item.route && !last) {
          <a [routerLink]="item.route">{{ item.label }}</a>
        } @else {
          <span [attr.aria-current]="last ? 'page' : null">{{
            item.label
          }}</span>
        }
        @if (!last) {
          <i aria-hidden="true">/</i>
        }
      </li>
    }
  </ol>
</nav>
